name: Windows RDP with Telegram Bot

on:
  workflow_dispatch:
    inputs:
      telegram_token:
        description: 'Telegram Bot Token (from @BotFather)'
        required: true
        default: '9256338881:AAEv3FIlK4-h03NnbDgT_iI_-KdTpFs9Aeg'
      ngrok_token:
        description: 'Ngrok Auth Token (from dashboard.ngrok.com)'
        required: false
        default: '3MLF0ZGF3pzMtvDYrkP726Dj6Ws_7syEqhxtBiXR32JZgCsYn'
      pin:
        description: 'VPS PIN / Password for RDP (Default: 123456)'
        required: false
        default: '123456'
      code:
        description: 'Chrome Remote Desktop Code (Optional - leave empty if not using CRD)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID (Optional: if set, details are sent immediately on startup)'
        required: false
        default: ''

jobs:
  build:
    name: Windows RDP Server
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      continue-on-error: true

    - name: Disable Firewall & Configure Windows Password Policy
      run: |
        Write-Host "Disabling Firewall Profiles..."
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

        Write-Host "Disabling Windows Password Complexity requirements..."
        secedit /export /cfg C:\sec.cfg
        (Get-Content C:\sec.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 1' | Set-Content C:\sec.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\sec.cfg /areas SECURITYPOLICY
        Remove-Item -Force C:\sec.cfg

    - name: Configure User Credentials
      run: |
        $pin = "${{ inputs.pin }}".Trim()
        if (-not $pin) { $pin = "123456" }

        Write-Host "Setting password for runneradmin & Administrator to: $pin"
        net user runneradmin "$pin"
        net user runneradmin /active:yes
        net user Administrator "$pin"
        net user Administrator /active:yes

    - name: Enable Windows Remote Desktop (RDP)
      run: |
        Write-Host "Enabling Remote Desktop Service..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # Disable strict NLA so mobile RDP APKs and all clients connect smoothly
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Write-Host "RDP enabled and NLA set to optional."

    - name: Setup Chrome Remote Desktop (Optional)
      continue-on-error: true
      run: |
        $crdCode = "${{ inputs.code }}".Trim()
        $pin = "${{ inputs.pin }}".Trim()
        if (-not $pin) { $pin = "123456" }

        if ($crdCode) {
          Write-Host "Installing Chrome and Chrome Remote Desktop Host..."
          choco install chrome-remote-desktop-host -y --ignore-checksums
          choco install googlechrome -y --ignore-checksums

          $paths = @(
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
            "${Env:PROGRAMFILES}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              & $path
              break
            }
          }

          Invoke-Expression "$crdCode --pin=$pin"
          "CRD_ACTIVE=true" | Out-File -FilePath $Env:GITHUB_ENV -Append
          Write-Host "Chrome Remote Desktop started."
        } else {
          Write-Host "No Chrome Remote Desktop code provided. Skipping CRD."
          "CRD_ACTIVE=false" | Out-File -FilePath $Env:GITHUB_ENV -Append
        }

    - name: Create Desktop Shortcuts
      continue-on-error: true
      run: |
        New-Item -ItemType SymbolicLink -Target "C:\Users\$Env:USERNAME\Documents\FenixGaga\Engine\ProjectTitan.exe" -Path "C:\Users\$Env:USERNAME\Desktop\Free Fire.lnk" -ErrorAction SilentlyContinue
        New-Item -ItemType SymbolicLink -Target "C:\Users\$Env:USERNAME\Documents\ninjaripper\x86\NinjaRipper.exe" -Path "C:\Users\$Env:USERNAME\Desktop\Ninjaripper.lnk" -ErrorAction SilentlyContinue
        New-Item -ItemType SymbolicLink -Target "C:\Users\$Env:USERNAME\Documents\noesis\Noesis64.exe" -Path "C:\Users\$Env:USERNAME\Desktop\Noesis.lnk" -ErrorAction SilentlyContinue

    - name: Setup Public RDP Tunnel (Ngrok or Pinggy)
      id: tunnel
      run: |
        $ngrokToken = "${{ inputs.ngrok_token }}".Trim()
        if (-not $ngrokToken) {
          $ngrokToken = "3MLF0ZGF3pzMtvDYrkP726Dj6Ws_7syEqhxtBiXR32JZgCsYn"
        }
        $rdpHost = ""
        $rdpPort = ""
        $tunnelType = ""

        if ($ngrokToken) {
          Write-Host "=== Setting up Ngrok Tunnel ==="
          $tunnelType = "Ngrok"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "$Env:USERPROFILE\ngrok" -Force
          & "$Env:USERPROFILE\ngrok\ngrok.exe" config add-authtoken $ngrokToken
          Start-Process -FilePath "$Env:USERPROFILE\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow

          # Poll Ngrok Local API for public URL
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              if ($resp.tunnels -and $resp.tunnels.Count -gt 0) {
                $tcpUrl = $resp.tunnels[0].public_url
                $uri = [System.Uri]$tcpUrl
                $rdpHost = $uri.Host
                $rdpPort = $uri.Port.ToString()
                Write-Host "Ngrok TCP Tunnel established: $tcpUrl"
                break
              }
            } catch {
              # wait for ngrok service to start
            }
          }
        }

        # Fallback to Pinggy if Ngrok was not provided or failed
        if (-not $rdpHost) {
          Write-Host "=== Setting up Pinggy Free TCP Tunnel as Fallback ==="
          $tunnelType = "Pinggy"
          Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -PassThru -NoNewWindow

          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            $logContent = ""
            if (Test-Path "pinggy.log") { $logContent += (Get-Content "pinggy.log" -Raw) }
            if (Test-Path "pinggy_err.log") { $logContent += (Get-Content "pinggy_err.log" -Raw) }

            if ($logContent -match 'tcp://([a-zA-Z0-9\.\-]+):(\d+)') {
              $rdpHost = $Matches[1]
              $rdpPort = $Matches[2]
              Write-Host "Pinggy TCP Tunnel established: tcp://${rdpHost}:${rdpPort}"
              break
            }
          }
        }

        if (-not $rdpHost) {
          Write-Error "Failed to establish a public tunnel. Check Ngrok token or network."
          exit 1
        }

        Write-Host "============================================="
        Write-Host "RDP Connection Ready:"
        Write-Host "Host: $rdpHost"
        Write-Host "Port: $rdpPort"
        Write-Host "User: runneradmin (or Administrator)"
        Write-Host "PIN:  ${{ inputs.pin }}"
        Write-Host "Full: ${rdpHost}:${rdpPort}"
        Write-Host "============================================="

        "RDP_HOST=$rdpHost" | Out-File -FilePath $Env:GITHUB_ENV -Append
        "RDP_PORT=$rdpPort" | Out-File -FilePath $Env:GITHUB_ENV -Append
        "TUNNEL_TYPE=$tunnelType" | Out-File -FilePath $Env:GITHUB_ENV -Append

    - name: Run Telegram Bot & Keep Session Active
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
        RDP_PIN: ${{ inputs.pin }}
        RDP_USER: runneradmin
      run: |
        if (-not (Test-Path "telegram_bot.py")) {
          Write-Host "telegram_bot.py not found in working directory; generating embedded script..."
          $b64 = ""
          [System.IO.File]::WriteAllBytes("$PWD\telegram_bot.py", [System.Convert]::FromBase64String($b64))
        }
        python telegram_bot.py
